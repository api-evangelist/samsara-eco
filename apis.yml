name: Samsara Eco
description: >-
  Samsara Eco is an Australian climate-technology company pioneering enzymatic
  recycling, a process that uses engineered enzymes to break plastics and
  synthetic textiles down into their molecular building blocks so they can be
  infinitely remade into new materials with no loss of quality. Spun out of the
  Australian National University, the company recovers nylon and polyester from
  mixed and coloured textile and plastic waste and partners with global brands
  to build a circular materials supply chain. It is a materials-science and
  biotech company rather than an API provider, and has no public developer,
  API, or technical integration surface at this time.
